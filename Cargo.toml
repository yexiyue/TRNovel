[package]
name = "trnovel"
version = "0.17.2"
edition = "2024"
rust-version = "1.89"
default-run = "trnovel"
description = "Terminal reader for novel"
authors = ["yexiyue <yexiyue666@qq.com>"]
license = "MIT"
keywords = ["CLI", "Terminal", "Novel", "Reader"]
repository = "https://github.com/yexiyue/TRNovel"
homepage = "https://yexiyue.github.io/TRNovel"

[[bin]]
name = "trnovel"
path = "src/bin/main.rs"

[[bin]]
name = "trn"
path = "src/bin/trn.rs"

[features]
default = ["tts"]
tts = ["dep:tokio-util"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
encoding_rs = { version = "0.8.35", features = ["serde"] }
fancy-regex = "0.18"
md5 = "0.8.0"
parse-book-source = { path = "crates/parse-book-source", version = "0.7.0", features = [
    "browser",
    "js",
    "js-host",
] }
ratatui = { version = "0.30.1", features = ["unstable", "serde"] }
throbber-widgets-tui = "0.11.0"
tui-tree-widget = "0.24.0"
tui-widget-list = "0.15.2"
tui-big-text = "0.8.7"
walkdir = "2.5.0"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
dirs = { workspace = true }
ratatui-kit = { version = "0.10.3", features = ["full"] }
ratatui-kit-themes = "0.1"
ratatui-kit-keymap = "0.1"
textwrap = { version = "0.16.2" }
tokio-util = { workspace = true, optional = true }
tts-protocol = { package = "novel-tts-protocol", path = "crates/novel-tts-protocol", version = "0.1.0" }
strum = { version = "0.28", features = ["derive"] }
swash = "0.2.7"
zeno = "0.3.3"
woff2 = { version = "0.4.0", package = "woff2-patched" }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }


[workspace]
members = ["crates/moss-tts", "crates/tts-candle-platform", "crates/omnivoice", "crates/voxcpm-sys", "crates/qwen3-tts", "crates/novel-tts-backends", "crates/novel-tts-core", "crates/novel-tts-protocol", "crates/novel-tts", "crates/parse-book-source"]

[workspace.dependencies]
moss-tts = { path = "crates/moss-tts" }
tts-candle-platform = { path = "crates/tts-candle-platform", version = "0.1.0" }
cmake = "0.1.58"
cc = "1.2"
qwen3-tts = { path = "crates/qwen3-tts", version = "0.3.0", default-features = false }
candle-core = "=0.9.2"
candle-nn = "=0.9.2"
candle-transformers = "=0.9.2"
tokenizers = { version = "0.22.2", default-features = false }
hound = "3.5"
rustfft = "6.4"
tracing = "0.1"
# API 21 leaves device selection to the application instead of enabling ORT's auto EP policy.
# Native prebuilt libraries still use the latest ONNX Runtime 1.28.
# Lax matching permits platform-independent all-features checks; runtime EPs stay explicit.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "tracing", "download-binaries", "tls-native", "copy-dylibs",
    "api-21", "pkg-config", "lax-feature-matching",
] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav", "tracing"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.12"
anyhow = "1.0.102"
thiserror = "2.0.18"
tokio = { version = "1.52", features = [
    "fs",
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.18"
futures = "0.3.32"
dirs = "6.0.0"
sha2 = "0.10.9"
tempfile = "3.27.0"

[profile.release]
lto = true
opt-level = 3
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

# Distribution variants are configured in dist-workspace.toml and dist.toml.

[dev-dependencies]
tempfile.workspace = true
ratatui-kit = { version = "0.10.3", features = ["test-util"] }

# Model integrity checks must remain practical in development builds.
[profile.dev.package.sha2]
opt-level = 3
