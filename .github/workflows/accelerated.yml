name: Accelerated listening artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            variant: listening-coreml
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            variant: listening-cuda
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            variant: listening-cuda
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - name: Build provider distribution
        shell: bash
        env:
          ORT_CUDA_VERSION: '13'
          CARGO_DIST_TARGET: ${{ matrix.target }}
          TRNOVEL_VARIANT_OUTPUT: target/accelerated/${{ matrix.variant }}-${{ matrix.target }}
        run: python .github/scripts/build-variant.py "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}-${{ matrix.target }}
          path: target/accelerated/
