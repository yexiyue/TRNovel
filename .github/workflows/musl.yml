name: ARM64 musl

on:
  pull_request:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trnovel-musl
            target/musl-build
          key: musl-alpine3.23-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '.github/scripts/build-musl.sh') }}
          restore-keys: musl-alpine3.23-${{ runner.arch }}-
      - name: Build with Alpine's musl and ONNX Runtime
        run: |
          mkdir -p "$HOME/.cache/trnovel-musl/registry" "$HOME/.cache/trnovel-musl/git"
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$HOME/.cache/trnovel-musl/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cache/trnovel-musl/git:/usr/local/cargo/git" \
            rust:1-alpine3.23 sh .github/scripts/build-musl.sh
      - name: Smoke-test in a clean Alpine runtime
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work \
            alpine:3.23 sh .github/scripts/smoke-musl.sh
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-musl
          path: |
            target/musl-distrib/trnovel-aarch64-unknown-linux-musl.tar.gz
            target/musl-distrib/trnovel-aarch64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
