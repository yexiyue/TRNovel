name: Publish npm with OIDC

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release to publish to npm
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/publish-npm.yml
      - .github/scripts/publish-npm.sh
      - Cargo.toml

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/trnovel-v'))
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11
      - name: Fetch release workflow artifacts
        if: inputs.plan != ''
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - name: Fetch existing GitHub Release package
        if: inputs.plan == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag=$(gh release view --json tagName --jq .tagName)
          fi
          [[ "$tag" =~ ^trnovel-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$tag" --pattern trnovel-npm-package.tar.gz --dir npm
      - name: Validate or publish package
        env:
          PLAN: ${{ inputs.plan }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: bash .github/scripts/publish-npm.sh
