name: Publish basic Homebrew formula
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/checkout@v6
        with:
          repository: yexiyue/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update basic formula
        env:
          RELEASE_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          mkdir -p tap/Formula
          cp artifacts/trnovel-basic.formula tap/Formula/trnovel-basic.rb
          cd tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/trnovel-basic.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: update trnovel-basic for $RELEASE_TAG"
            git push
          fi
