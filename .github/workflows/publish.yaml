name: Publish Rust Crate by Tag

on:
  push:
    tags:
      - "*-v*"
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'push'
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install libasound2-dev

      - name: Extract crate prefix and version from tag
        id: extract
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$TAG_NAME" =~ ^v[0-9].* ]]; then
            # Handle tags like "v0.7.2"
            PREFIX="trnovel"
            VERSION=$(echo "$TAG_NAME" | sed -E 's/v([0-9].*)/\1/')
          else
            # Handle tags like "parse-book-source-v0.1.6"
            PREFIX=$(echo "$TAG_NAME" | sed -E 's/(.*)-v[0-9].*/\1/')
            VERSION=$(echo "$TAG_NAME" | sed -E 's/.*-v([0-9].*)/\1/')
          fi
          echo $PREFIX
          echo $VERSION
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # 根据前缀确定路径
          case "${{ steps.extract.outputs.prefix }}" in
            parse-book-source)
              CRATE_PATH="crates/${{ steps.extract.outputs.prefix }}" ;;
            trnovel) CRATE_PATH="./" ;;
            *) echo "Unknown crate tag prefix" >&2; exit 1 ;;
          esac

          if [ ! -f "$CRATE_PATH/Cargo.toml" ]; then
            echo "Crate path $CRATE_PATH not found!" && exit 1
          fi

          cd "$CRATE_PATH"
          ls
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

  bootstrap-talechime-secrets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure Talechime publishing credentials
        env:
          GH_TOKEN: ${{ secrets.TALECHIME_BOOTSTRAP_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -eu
          test -n "$GH_TOKEN"
          test -n "$CARGO_REGISTRY_TOKEN"
          test -n "$HOMEBREW_TAP_TOKEN"
          printf '%s' "$CARGO_REGISTRY_TOKEN" | gh secret set CARGO_REGISTRY_TOKEN --repo yexiyue/talechime
          printf '%s' "$HOMEBREW_TAP_TOKEN" | gh secret set HOMEBREW_TAP_TOKEN --repo yexiyue/talechime
