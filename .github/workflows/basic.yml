name: Basic reader artifacts
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build basic reader
        shell: bash
        env:
          CARGO_DIST_TARGET: ${{ matrix.target }}
        run: |
          export TRNOVEL_VARIANT_OUTPUT="$PWD/target/basic-stage/$CARGO_DIST_TARGET"
          python .github/scripts/build-variant.py basic
          python .github/scripts/smoke-variant.py basic "$TRNOVEL_VARIANT_OUTPUT" "$CARGO_DIST_TARGET"
          python .github/scripts/package-basic.py
          python .github/scripts/generate-basic-installers.py --directory target/basic-distrib --platform "$CARGO_DIST_TARGET"
          python .github/scripts/smoke-basic-installers.py --directory target/basic-distrib --target "$CARGO_DIST_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-basic-${{ matrix.target }}
          path: |
            target/basic-distrib/trnovel-basic-${{ matrix.target }}.*
          if-no-files-found: error
