[workspace]
members = ["dist:."]

# cargo-dist 0.32.0 configuration. Cargo source workspace remains unchanged.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
github-build-setup = "../build-setup.yml"
# Native Alpine build keeps musl-compatible ONNX Runtime/ALSA dependencies.
local-artifacts-jobs = ["./musl", "./basic"]
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A namespace to use when publishing this package to the npm registry
npm-scope = "@trnovel"
# Only treat tags prefixed with this namespace as dist releases (keeps the
# workspace library tags like `parse-book-source-v*` from triggering this workflow)
tag-namespace = "trnovel"
# Publish npm through OIDC; no long-lived NPM_TOKEN is needed.
# homebrew needs the `yexiyue/homebrew-tap` repo to exist + a HOMEBREW_TAP_TOKEN secret (PAT with repo scope)
publish-jobs = ["./publish-npm", "homebrew", "./publish-basic-homebrew"]
github-custom-job-permissions = { "publish-npm" = { contents = "read", id-token = "write" }, "publish-basic-homebrew" = { contents = "read" } }
# Homebrew tap repository that dist publishes the formula to
tap = "yexiyue/homebrew-tap"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# 动态链接 Windows C 运行时（默认 true=静态）。ort/onnxruntime 预编译库按动态 CRT 编译，
# 静态链接会导致 __imp_tolower 等符号未解析的 LNK2001 链接错误，故必须设为 false。
msvc-crt-static = false

[dist.dependencies.apt]
libasound2-dev = '*'
libssl-dev = '*'
pkg-config = '*'
