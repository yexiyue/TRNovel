[package]
name = "moss-tts"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle computation for MOSS speech models"

[features]
default = []
cuda = ["dep:tts-candle-platform", "tts-candle-platform/cuda"]
metal = ["dep:tts-candle-platform", "tts-candle-platform/metal"]

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, features = ["fancy-regex"] }
tts-candle-platform = { workspace = true, optional = true }
hound.workspace = true
rand = "0.9"

[dev-dependencies]
tempfile.workspace = true
