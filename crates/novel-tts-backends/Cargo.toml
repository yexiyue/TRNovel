[package]
name = "novel-tts-backends"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native model adapters for novel-tts"
repository = "https://github.com/yexiyue/TRNovel"

[features]
default = ["moss", "alignment"]
alignment = ["dep:ort", "dep:tokenizers", "dep:rustfft", "dep:rubato"]
moss = ["dep:ort", "dep:sentencepiece-rs", "dep:rand", "dep:hound", "dep:rubato"]
kokoro = ["dep:ort", "dep:kokoro-tts"]
qwen = ["dep:qwen3-tts", "dep:hound"]
metal = ["qwen", "dep:candle-metal", "dep:candle-nn-metal", "dep:candle-transformers-metal"]
coreml = ["dep:ort", "ort/coreml"]
cuda = ["dep:ort", "ort/cuda"]

[dependencies]
qwen3-tts = { workspace = true, optional = true }
tts-core = { package = "novel-tts-core", path = "../novel-tts-core", version = "0.3.0" }
tts-protocol = { package = "novel-tts-protocol", path = "../novel-tts-protocol", version = "0.1.0" }
ort = { workspace = true, optional = true }
kokoro-tts = { workspace = true, optional = true }
sentencepiece-rs = { version = "0.2.2", optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
rustfft = { version = "6.4", optional = true }
rand = { version = "0.9", optional = true }
hound = { version = "3.5", optional = true }
rubato = { version = "0.16", optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
dirs.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal = { package = "candle-core", version = "=0.9.2", features = ["metal"], optional = true }
candle-nn-metal = { package = "candle-nn", version = "=0.9.2", features = ["metal"], optional = true }
candle-transformers-metal = { package = "candle-transformers", version = "=0.9.2", features = ["metal"], optional = true }


[[example]]
name = "basic"
required-features = ["kokoro"]
[[example]]
name = "baseline"
required-features = ["kokoro"]
[[example]]
name = "moss"
required-features = ["moss"]

[[example]]
name = "alignment_probe"
required-features = ["moss"]

[[example]]
name = "alignment"
required-features = ["alignment", "moss"]

[[example]]
name = "device_calibration"
required-features = ["moss"]

[[example]]
name = "continuity"
required-features = ["moss"]
[[example]]
name = "moss_probe"
required-features = ["moss"]

[[example]]
name = "qwen"
required-features = ["qwen"]
