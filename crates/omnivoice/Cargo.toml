[package]
name="omnivoice"
version="0.1.0"
edition="2024"
license="Apache-2.0"
[dependencies]
tts-candle-platform = { workspace = true, optional = true }
candle-core.workspace=true
candle-nn.workspace=true
candle-transformers.workspace=true
half="2.4.1"
hound.workspace=true
regex.workspace=true
safetensors="0.7.0"
serde.workspace=true
serde_json.workspace=true
strsim="0.11.1"
symphonia={version="0.5.5",default-features=false,features=["aac","flac","isomp4","mp3","ogg","pcm","vorbis","wav"]}
thiserror.workspace=true
tokenizers={workspace=true,features=["fancy-regex"]}
rand="0.9"
unicode-general-category="1.1.0"
[features]
default=[]
cuda=["dep:tts-candle-platform","tts-candle-platform/cuda"]
metal=["dep:tts-candle-platform","tts-candle-platform/metal"]

[dev-dependencies]
tempfile.workspace=true
