[package]
name = "novel-tts"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Independent novel listening CLI and JSON Lines worker"
repository = "https://github.com/yexiyue/TRNovel"

[[bin]]
name = "novel-tts"
path = "src/main.rs"

[features]
default = ["moss", "alignment"]
moss = ["tts-backends/moss"]
moss-nano-candle = ["moss", "tts-backends/moss-nano-candle"]
moss-nano-candle-metal = ["moss-nano-candle", "tts-backends/moss-nano-candle-metal"]
moss-nano-candle-cuda = ["moss-nano-candle", "tts-backends/moss-nano-candle-cuda"]

moss-candle = ["moss", "tts-backends/moss-candle"]
moss-candle-cuda = ["moss-candle", "tts-backends/moss-candle-cuda"]
moss-candle-metal = ["moss-candle", "tts-backends/moss-candle-metal"]
qwen = ["tts-backends/qwen"]
metal = ["qwen", "tts-backends/metal"]
alignment = ["tts-backends/alignment"]
qwen-onnx = ["qwen", "tts-backends/qwen-onnx"]
omnivoice-onnx = ["omnivoice", "tts-backends/omnivoice-onnx"]
coreml = ["tts-backends/coreml"]
ort-cuda = ["tts-backends/ort-cuda"]
qwen-cuda = ["qwen", "tts-backends/qwen-cuda"]
voxcpm = ["tts-backends/voxcpm"]
voxcpm-cuda = ["voxcpm", "tts-backends/voxcpm-cuda"]
voxcpm-metal = ["voxcpm", "tts-backends/voxcpm-metal"]
omnivoice = ["tts-backends/omnivoice"]
omnivoice-cuda = ["omnivoice", "tts-backends/omnivoice-cuda"]
omnivoice-metal = ["omnivoice", "tts-backends/omnivoice-metal"]

[dependencies]
tts-backends = { package = "novel-tts-backends", path = "../novel-tts-backends", version = "0.1.0", default-features = false }
tts-core = { package = "novel-tts-core", path = "../novel-tts-core", version = "0.3.0" }
tts-protocol = { package = "novel-tts-protocol", path = "../novel-tts-protocol", version = "0.1.0" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures.workspace = true
tempfile.workspace = true
