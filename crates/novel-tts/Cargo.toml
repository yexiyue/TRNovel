[package]
name = "novel-tts"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Independent novel listening CLI and JSON Lines worker"
repository = "https://github.com/yexiyue/TRNovel"

[[bin]]
name = "novel-tts"
path = "src/main.rs"

[dependencies]
tts-core = { package = "novel-tts-core", path = "../novel-tts-core", version = "0.3.0" }
tts-protocol = { package = "novel-tts-protocol", path = "../novel-tts-protocol", version = "0.1.0" }
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
