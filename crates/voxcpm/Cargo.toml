[package]
name = "voxcpm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native Candle VoxCPM2 inference from the production GGUF weights"

[features]
default = []
cuda = ["tts-candle-platform/cuda"]
metal = ["tts-candle-platform/metal"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
tts-candle-platform.workspace = true
serde_json.workspace = true
tokenizers = { workspace = true, features = ["onig"] }

[dev-dependencies]
anyhow.workspace = true
hound.workspace = true

