[package]
name = "trnovel"
version = "0.17.2"
repository = "https://github.com/yexiyue/TRNovel"
homepage = "https://yexiyue.github.io/TRNovel"
license = "MIT"
description = "Terminal reader for novel with independent listening worker"
binaries = ["trnovel", "trn", "novel-tts"]
build-command = ["python3", ".github/scripts/build-variant.py", "listening"]

[dist]

[[dist.extra-artifacts]]
build = ["python3", ".github/scripts/generate-basic-installers.py"]
artifacts = [
    "target/distrib/trnovel-basic-aarch64-apple-darwin.tar.xz",
    "target/distrib/trnovel-basic-aarch64-apple-darwin.tar.xz.sha256",
    "target/distrib/trnovel-basic-x86_64-apple-darwin.tar.xz",
    "target/distrib/trnovel-basic-x86_64-apple-darwin.tar.xz.sha256",
    "target/distrib/trnovel-basic-x86_64-unknown-linux-gnu.tar.xz",
    "target/distrib/trnovel-basic-x86_64-unknown-linux-gnu.tar.xz.sha256",
    "target/distrib/trnovel-basic-x86_64-pc-windows-msvc.zip",
    "target/distrib/trnovel-basic-x86_64-pc-windows-msvc.zip.sha256",
    "target/distrib/trnovel-basic-installer.sh",
    "target/distrib/trnovel-basic-installer.ps1",
    "target/distrib/trnovel-basic-npm-package.tar.gz",
    "target/distrib/trnovel-basic.formula",
]
