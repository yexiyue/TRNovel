pre-commit:
  jobs:
    - name: test
      run: cargo test --locked --features trnovel/tts,parse-book-source/browser,parse-book-source/js-host,parse-book-source/schema,novel-tts/qwen,novel-tts/voxcpm,novel-tts/omnivoice,novel-tts/coreml,novel-tts/ort-cuda,qwen3-tts/profiling --workspace --lib --tests --examples

    - name: clippy
      # run: cargo clippy --all-targets --features trnovel/tts,parse-book-source/browser,parse-book-source/js-host,parse-book-source/schema,novel-tts/qwen,novel-tts/voxcpm,novel-tts/omnivoice,novel-tts/coreml,novel-tts/ort-cuda,qwen3-tts/profiling --workspace -- -D warnings
      run: cargo clippy --all-targets --features trnovel/tts,parse-book-source/browser,parse-book-source/js-host,parse-book-source/schema,novel-tts/qwen,novel-tts/voxcpm,novel-tts/omnivoice,novel-tts/coreml,novel-tts/ort-cuda,qwen3-tts/profiling --workspace --fix --allow-dirty
      stage_fixed: true

    - name: rustfmt
      run: cargo fmt --all
      stage_fixed: true

    - name: docs
      run: cargo doc --no-deps --document-private-items --features trnovel/tts,parse-book-source/browser,parse-book-source/js-host,parse-book-source/schema,novel-tts/qwen,novel-tts/voxcpm,novel-tts/omnivoice,novel-tts/coreml,novel-tts/ort-cuda,qwen3-tts/profiling --workspace --examples
